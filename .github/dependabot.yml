version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
