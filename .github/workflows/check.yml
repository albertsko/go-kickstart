name: Check
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The exclusion keeps the runner's own Homebrew out of the cache.
      - id: brew-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/linuxbrew/.linuxbrew/*
            !/home/linuxbrew/.linuxbrew/Homebrew
          key: brew-v2-${{ runner.os }}-${{ runner.arch }}-
          restore-keys: brew-v2-${{ runner.os }}-${{ runner.arch }}-
      - id: install
        run: ci/install-tools.sh
      # Only main saves the cache, so pull requests cannot poison it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.install.outputs.key != steps.brew-cache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/linuxbrew/.linuxbrew/*
            !/home/linuxbrew/.linuxbrew/Homebrew
          key: ${{ steps.install.outputs.key }}
      - run: ./run ci
