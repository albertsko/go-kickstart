name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions: {}
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          minimum_release_age: 7d
      - run: mise run upgrade
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run ci
      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          branch: automation/update-tools
          delete-branch: true
          add-paths: |
            hk.pkl
            mise.toml
          commit-message: "build(tools): update mise tools"
          title: "build(tools): update mise tools"
          body: Updates mise tools after a seven-day release delay. Verified with `mise run ci`.
