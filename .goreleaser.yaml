version: 2
project_name: go-kickstart
builds:
  - main: ./cmd/go-kickstart
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  format: "{{ .Message }}{{ if .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: Breaking changes
      regexp: '^\w+(\([^)]*\))?!:'
      order: -1
    - title: Features
      regexp: '^feat(\([^)]*\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]*\))?:'
      order: 1
    - title: Other changes
      order: 999
release:
  prerelease: auto
  header: |
    {{ .TagSubject }}
    {{- with .TagBody }}

    {{ . }}
    {{- end }}
