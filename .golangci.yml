# Universal golangci-lint config. Tested on golangci-lint v2.15.0.
# Strict on bugs, security, and error handling, but moderate on style.

version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: none
  enable:
    # Bugs and correctness.
    - bidichk
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - nosprintfhostport
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - unused

    # Security.
    - gosec

    # Tests.
    - thelper
    - usetesting

    # Maintainability and idioms.
    - asciicheck
    - canonicalheader
    - dupword
    - errname
    - gocognit
    - godoclint
    - goprintffuncname
    - mirror
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  # Disabled linters:
  #
  # Third-party libraries only:
  #   arangolint, clickhouselint, exptostd, ginkgolinter, promlinter, protogetter, spancheck,
  #   testifylint, zerologlint
  # Deprecated:
  #   exhaustruct, gomodguard, wsl
  # Need project-specific rules:
  #   depguard, goheader, gomodguard_v2, importas
  # Overlap or alternative metrics, not exact replacements (selected tool in parentheses):
  #   cyclop, gocyclo, maintidx, nestif, funlen (gocognit), intrange (modernize),
  #   predeclared (revive), loggercheck (govet, sloglint), wastedassign (ineffassign, staticcheck),
  #   copyloopvar (modernize), forcetypeassert (errcheck), errchkjson (staticcheck, errcheck)
  # Previously omitted for maintenance concerns. Recheck current evidence before enabling:
  #   asasalint, tparallel
  # Omitted to limit structural restrictions and project-dependent warnings:
  #   contextcheck, dupl, err113, exhaustruct_v5, gochecknoglobals, gochecknoinits, godox,
  #   goconst, mnd, musttag, nlreturn, noinlineerr, nonamedreturns, paralleltest, prealloc,
  #   testpackage, varnamelen, wrapcheck
  # Style or policy choices that are not universal:
  #   containedctx, decorder, dogsled, embeddedstructfieldcheck, forbidigo, funcorder, godot,
  #   gomoddirectives, gosmopolitan, grouper, iface, inamedparam, interfacebloat, iotamixing,
  #   ireturn, lll, perfsprint, tagalign, tagliatelle, testableexamples, unqueryvet, whitespace,
  #   wsl_v5

  settings:
    dupword:
      comments-only: true

    errcheck:
      check-type-assertions: true

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - commentedOutCode

    gosec:
      excludes:
        - G104 # Use errcheck as the primary unchecked-error checker.

    modernize:
      disable:
        - omitzero # golangci-lint v2.15.0 conflicts on alternative JSON-tag fixes.

    nolintlint:
      require-specific: true
      require-explanation: true

    revive:
      enable-default-rules: true
      rules:
        - name: datarace
        - name: defer
        - name: forbidden-call-in-wg-go

  exclusions:
    presets:
      - comments
      - common-false-positives

formatters:
  enable:
    - goimports
    - gofumpt
